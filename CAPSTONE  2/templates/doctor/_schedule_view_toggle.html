{% comment %}
Month | Week | Day switcher for the doctor's desktop schedule widget.
Included by all three grid templates with the current `view` and the
`selected_date` to carry into the next view.
{% endcomment %}
<div class="flex items-center rounded-lg bg-softgray p-0.5 shrink-0">
  <button type="button"
          hx-get="{% url 'doctor:schedule_grid_partial' %}?view=month&date={{ selected_date }}"
          hx-target="#schedule-grid-widget" hx-swap="outerHTML"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer {% if view == 'month' %}bg-white shadow-soft-sm text-ink{% else %}text-gray-500 hover:text-ink{% endif %}">
    Month
  </button>
  <button type="button"
          hx-get="{% url 'doctor:schedule_grid_partial' %}?view=week&date={{ selected_date }}"
          hx-target="#schedule-grid-widget" hx-swap="outerHTML"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer {% if view == 'week' %}bg-white shadow-soft-sm text-ink{% else %}text-gray-500 hover:text-ink{% endif %}">
    Week
  </button>
  <button type="button"
          hx-get="{% url 'doctor:schedule_grid_partial' %}?view=day&date={{ selected_date }}"
          hx-target="#schedule-grid-widget" hx-swap="outerHTML"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer {% if view == 'day' %}bg-white shadow-soft-sm text-ink{% else %}text-gray-500 hover:text-ink{% endif %}">
    Day
  </button>
</div>
