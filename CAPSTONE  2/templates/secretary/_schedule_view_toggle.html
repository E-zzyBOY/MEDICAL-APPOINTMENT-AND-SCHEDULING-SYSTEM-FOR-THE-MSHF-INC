{% comment %}
Month | Week | Day switcher for the secretary's availability calendar.
Included by all three grid templates with the current `view` and an
`anchor` date (ISO) to carry into the next view.
{% endcomment %}
<div class="flex items-center rounded-lg bg-softgray p-0.5 shrink-0">
  <button type="button"
          hx-get="{% url 'secretary:schedule_grid_partial' %}?view=month&year={{ anchor|slice:':4' }}&month={{ anchor|slice:'5:7' }}"
          hx-target="#secretary-schedule-grid" hx-swap="outerHTML"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer {% if view == 'month' %}bg-white shadow-soft-sm text-ink{% else %}text-gray-500 hover:text-ink{% endif %}">
    Month
  </button>
  <button type="button"
          hx-get="{% url 'secretary:schedule_grid_partial' %}?view=week&date={{ anchor }}"
          hx-target="#secretary-schedule-grid" hx-swap="outerHTML"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer {% if view == 'week' %}bg-white shadow-soft-sm text-ink{% else %}text-gray-500 hover:text-ink{% endif %}">
    Week
  </button>
  <button type="button"
          hx-get="{% url 'secretary:schedule_grid_partial' %}?view=day&date={{ anchor }}"
          hx-target="#secretary-schedule-grid" hx-swap="outerHTML"
          class="px-2.5 py-1 rounded-md text-xs font-medium transition cursor-pointer {% if view == 'day' %}bg-white shadow-soft-sm text-ink{% else %}text-gray-500 hover:text-ink{% endif %}">
    Day
  </button>
</div>
